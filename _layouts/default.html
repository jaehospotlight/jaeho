<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — Personal Site{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — Personal Site{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — Personal Site{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  {% unless page.layout == 'post' %}
  <meta property="og:image" content="{{ '/assets/images/og.png' | absolute_url }}">
  <meta name="twitter:image" content="{{ '/assets/images/og.png' | absolute_url }}">
  {% endunless %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=journal-2">
  <script src="{{ '/assets/js/ascii-motion.js' | relative_url }}?v=journal-2" defer></script>
</head>
<body{% if page.title == "Home" %} class="home-page"{% endif %}>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="nav" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}" class="nav-mark" aria-label="Jaeho Lee, home">JAEHO LEE</a>
    <div class="nav-status" aria-hidden="true">NEW YORK / {{ 'now' | date: "%Y" }}</div>
    <div class="nav-links">
      <a href="{{ '/blog' | relative_url }}">Writing</a>
      <a href="{{ '/reading' | relative_url }}">Reading</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </div>
  </nav>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="footer">
    <a href="{{ '/' | relative_url }}" class="footer-name">Jaeho Lee</a>
    <p>New York City · © {{ 'now' | date: "%Y" }}</p>
    <div class="footer-links">
      <a href="https://x.com/_jaeholee_" target="_blank" rel="noopener">X ↗</a>
      <a href="https://www.linkedin.com/in/jaeholee2002/" target="_blank" rel="noopener">LinkedIn ↗</a>
    </div>
  </footer>
</body>
</html>
