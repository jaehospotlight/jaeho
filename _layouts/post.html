---
layout: default
---

<article class="post">
  <header class="post-header">
    <a class="post-back" href="{{ '/blog' | relative_url }}">← Writing / index</a>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <footer class="post-end">
    <p>Written by Jaeho Lee.</p>
    <a href="mailto:jaeho@tryspotlight.co?subject=Re%3A%20{{ page.title | uri_escape }}">Continue the conversation →</a>
  </footer>
</article>
